name: Release

# HACS installs from GitHub releases. Push a tag such as v0.1.0 that matches the version in manifest.json, and this
# makes the release, with notes from the commits since the last one.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: The tag must match the version in manifest.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/cellar_circle/manifest.json'))['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match manifest.json version $version" >&2
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes --verify-tag
