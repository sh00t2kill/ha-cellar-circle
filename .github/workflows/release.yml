name: Release

# Actions → Release → Run workflow. Works out the next version from the latest tag, puts it in manifest.json, commits that
# to main, tags it and makes the GitHub release that HACS installs from. The very first release uses the version already
# in manifest.json, whatever you pick.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the latest tag's version to raise
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      create_release:
        description: Make a GitHub release (HACS needs one) as well as the tag
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Bump the version and release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      MANIFEST: custom_components/cellar_circle/manifest.json
      BUMP: ${{ inputs.bump }}
      CREATE_RELEASE: ${{ inputs.create_release }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Only from main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Run this from the main branch, not $REF." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # The push below uses the token directly, so nothing is left behind in the checkout.
          persist-credentials: false
      - name: Work out the next version
        id: version
        run: |
          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          manifest_version=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['version'])" "$MANIFEST")
          next=$(python3 .github/scripts/version.py next "$latest_tag" "$manifest_version" "$BUMP")
          if git rev-parse --verify --quiet "refs/tags/v$next" >/dev/null; then
            echo "Tag v$next already exists" >&2
            exit 1
          fi
          echo "Latest tag: ${latest_tag:-none}. Next version: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
      - name: Put the version in manifest.json and tag it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 .github/scripts/version.py write "$MANIFEST" "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- "$MANIFEST"; then
            git add -- "$MANIFEST"
            git commit -m "Release v$VERSION"
          fi
          git tag "v$VERSION"
      - name: Push the commit and the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:main "refs/tags/v$VERSION"
      - name: Make the GitHub release
        if: ${{ inputs.create_release }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --repo "$REPO" --title "v$VERSION" --generate-notes --verify-tag
